name: Publish to MCP Registry

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download and Install MCP Publisher CLI
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Authenticate to MCP Registry via OIDC
        run: ./mcp-publisher login github-oidc

      - name: Create Temporary server.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          cat > server.json <<EOF
          {
            "\$schema": "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json",
            "name": "io.github.EQIQs/rapport-axis-core",
            "title": "EQIQs Rapport Axis",
            "description": "EQIQs Workplace Dynamics & Psychometric Compatibility Scoring",
            "version": "$VERSION",
            "remotes": [
              {
                "type": "streamable-http",
                "url": "https://adgmsnwjynqkhawhioil.supabase.co/functions/v1/mcp-server"
              }
            ]
          }
          EOF

          echo "Generated server.json:"
          cat server.json

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
