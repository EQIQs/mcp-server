name: Publish to MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Registry version to publish, for example 1.0.17"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download and Install MCP Publisher CLI
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Authenticate to MCP Registry via OIDC
        run: ./mcp-publisher login github-oidc

      - name: Create Temporary server.json
        env:
          PUBLISH_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VERSION="${PUBLISH_VERSION#v}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          cat > server.json <<EOF
          {
            "\$schema": "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json",
            "name": "io.github.EQIQs/rapport-axis-core",
            "title": "EQIQs",
            "description": "EQIQs: 21-framework personality and compatibility for coaching, communication, and team development.",
            "version": "$VERSION",
            "remotes": [
              {
                "type": "streamable-http",
                "url": "https://adgmsnwjynqkhawhioil.supabase.co/functions/v1/mcp-server"
              }
            ]
          }
          EOF

          echo "Generated server.json:"
          cat server.json

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
